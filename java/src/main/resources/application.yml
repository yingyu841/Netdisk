  aliyun:
    access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
    sms-region: ${ALIYUN_SMS_REGION:cn-hangzhou}
    sms-sign-name: ${ALIYUN_SMS_SIGN_NAME:}
    sms-template-code: ${ALIYUN_SMS_TEMPLATE_CODE:}
    dm-region: ${ALIYUN_DM_REGION:cn-hangzhou}
    dm-from-address: ${ALIYUN_DM_FROM_ADDRESS:}
    dm-from-alias: ${ALIYUN_DM_FROM_ALIAS:}
    dm-reply-to-address: ${ALIYUN_DM_REPLY_TO_ADDRESS:true}

# SQL：默认开启 DEBUG（SQL+绑定参数）。写入 logs/sql-debug.log 与控制台（见 logback-spring.xml），不在 access.log。
# 关闭：export MAPPER_SQL_LOG_LEVEL=INFO ；需要 MyBatis 每行结果：--spring.profiles.active=sql-log 或 MAPPER_SQL_LOG_LEVEL=TRACE
logging:
  level:
    root: INFO
    com.netdisk.mapper: ${MAPPER_SQL_LOG_LEVEL:INFO}
    org.springframework.jdbc.core: ${SPRING_JDBC_CORE_LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

---
# profile「sql-log」：在默认 DEBUG 基础上，Mapper 升为 TRACE（打印每行结果），日志量更大
# 启动：--spring.profiles.active=sql-log ；与其它 profile：prod,sql-log
spring:
  config:
    activate:
      on-profile: sql-log
logging:
  level:
    com.netdisk.mapper: TRACE
    org.springframework.jdbc.core: DEBUG
    org.springframework.jdbc.core.StatementCreatorUtils: TRACE
